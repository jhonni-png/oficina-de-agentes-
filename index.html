<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Agent 3D Office — Executive Suite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="canvas-3d-container"></div>

  <div id="hud-top">
    <input id="mission-input" type="text" placeholder="Escribe tu misión para los agentes..." autocomplete="off" />
    <button id="btn-run" class="primary" type="button">Ejecutar Misión</button>
    <button id="btn-demo" type="button" aria-pressed="false">Modo Demo</button>
    <button id="btn-settings" type="button">Configuración</button>
  </div>
  <div id="conn-status" data-state="off">Sin conexión a Supabase</div>

  <div id="agent-bar"></div>

  <aside id="logs-panel" aria-label="Logs en vivo">
    <div id="logs-header">
      <span>Logs en Vivo</span>
      <span class="actions">
        <button id="btn-logs-clear" type="button">Limpiar</button>
        <button id="btn-logs-close" type="button">Cerrar</button>
      </span>
    </div>
    <div id="logs-list"></div>
  </aside>
  <button id="logs-toggle" type="button">Logs en Vivo</button>

  <div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-card">
      <h2 id="settings-title">Configuración</h2>
      <p>Se guardan solo en este navegador (localStorage). La Publishable Key de Supabase es apta para el navegador; la seguridad de escritura se controla con RLS.</p>
      <label for="cfg-supabase-url">SUPABASE_URL</label>
      <input id="cfg-supabase-url" type="url" placeholder="https://xxxx.supabase.co" autocomplete="off" />
      <label for="cfg-supabase-key">SUPABASE_PUBLISHABLE_KEY</label>
      <input id="cfg-supabase-key" type="password" placeholder="sb_publishable_..." autocomplete="off" />
      <label for="cfg-n8n-url">N8N_WEBHOOK_URL</label>
      <input id="cfg-n8n-url" type="url" placeholder="https://tu-space.hf.space/webhook/mision" autocomplete="off" />
      <div class="modal-actions">
        <button id="cfg-cancel" type="button">Cancelar</button>
        <button id="cfg-save" class="primary" type="button">Guardar y reconectar</button>
      </div>
    </div>
  </div>

<script src="js/core.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/decor.js"></script>
<script src="js/lounge.js"></script>
<script src="js/boot.js"></script>
<script src="js/supabase.js"></script>
<script src="js/mission.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
